<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5d4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Expenses" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>My Expenses</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Personal finance</p>
        <h1>Monthly Expenses</h1>
      </div>
      <button id="resetBtn" class="icon-btn" aria-label="Reset all data" title="Reset all data">↻</button>
    </header>

    <section class="month-row" aria-label="Choose month">
      <button id="prevMonth" class="month-arrow" aria-label="Previous month">‹</button>
      <div id="monthScroller" class="month-scroller"></div>
      <button id="nextMonth" class="month-arrow" aria-label="Next month">›</button>
    </section>

    <section class="summary-card">
      <p id="summaryMonth" class="summary-label"></p>
      <div id="balance" class="balance">$0.00</div>
      <div class="summary-grid">
        <div>
          <span>Income</span>
          <strong id="incomeTotal">$0.00</strong>
        </div>
        <div>
          <span>Expenses</span>
          <strong id="expenseTotal">$0.00</strong>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Year at a glance</p>
          <h2>Monthly spending</h2>
        </div>
      </div>
      <div id="yearChart" class="year-chart" aria-label="Monthly spending chart"></div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Breakdown</p>
          <h2>Categories</h2>
        </div>
      </div>
      <div id="categoryList" class="category-list"></div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Activity</p>
          <h2>Transactions</h2>
        </div>
      </div>
      <div id="transactionList" class="transaction-list"></div>
    </section>
  </main>

  <button id="addBtn" class="floating-btn" aria-label="Add transaction">+</button>

  <dialog id="transactionDialog">
    <form id="transactionForm" method="dialog">
      <div class="dialog-header">
        <h2>Add transaction</h2>
        <button type="button" id="closeDialog" class="icon-btn" aria-label="Close">×</button>
      </div>

      <label>
        Type
        <select id="typeInput" required>
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </label>

      <label>
        Amount (CAD)
        <input id="amountInput" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required />
      </label>

      <label>
        Category
        <select id="categoryInput" required></select>
      </label>

      <label>
        Description
        <input id="descriptionInput" type="text" maxlength="60" placeholder="e.g. Groceries" required />
      </label>

      <label>
        Date
        <input id="dateInput" type="date" required />
      </label>

      <button class="primary-btn" type="submit">Save transaction</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
